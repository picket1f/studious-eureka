<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131c">
  <title>Simple Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131c;
      color: #f5f7ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #252c43 0%, #10131c 58%);
    }

    .calculator {
      width: min(100%, 360px);
      padding: 24px;
      border: 1px solid #343b52;
      border-radius: 24px;
      background: #191e2b;
      box-shadow: 0 24px 70px #0008;
    }

    h1 {
      margin: 0 0 18px;
      color: #b6bfd8;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    .display {
      min-height: 104px;
      margin-bottom: 18px;
      padding: 18px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
      border: 1px solid #30384c;
      border-radius: 16px;
      background: #111520;
      color: #fff;
      font-size: clamp(2rem, 11vw, 3rem);
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-height: 62px;
      border: 1px solid transparent;
      border-radius: 15px;
      background: #282f40;
      color: #f5f7ff;
      font: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #363f54; }
    button:active { transform: scale(0.96); }
    button:focus-visible { outline: 3px solid #aeb9ff; outline-offset: 2px; }
    button.utility { background: #343c50; color: #c9d1e8; }
    button.operator { background: #303b63; color: #dce2ff; }
    button.equals { background: #7185f5; color: #fff; }
    button.equals:hover { background: #8293ff; }
    button.zero { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Calculator</h1>
    <output class="display" id="display" aria-live="polite" aria-label="Display">0</output>
    <div class="keys" aria-label="Calculator keys">
      <button class="utility" data-action="clear" aria-label="Clear">AC</button>
      <button class="utility" data-action="delete" aria-label="Delete last digit">DEL</button>
      <button class="utility" data-action="sign" aria-label="Change sign">±</button>
      <button class="operator" data-operator="/" aria-label="Divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operator="*" aria-label="Multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operator="-" aria-label="Subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-operator="+" aria-label="Add">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script>
    const display = document.querySelector("#display");
    let current = "0";
    let stored = null;
    let operator = null;
    let replaceCurrent = false;

    function updateDisplay() {
      display.textContent = current;
    }

    function enterDigit(digit) {
      if (current === "Error" || replaceCurrent) {
        current = digit;
        replaceCurrent = false;
      } else if (current === "0") {
        current = digit;
      } else if (current.replace("-", "").length < 14) {
        current += digit;
      }
      updateDisplay();
    }

    function enterDecimal() {
      if (current === "Error" || replaceCurrent) {
        current = "0.";
        replaceCurrent = false;
      } else if (!current.includes(".")) {
        current += ".";
      }
      updateDisplay();
    }

    function calculate() {
      const left = Number(stored);
      const right = Number(current);
      let result;

      switch (operator) {
        case "+": result = left + right; break;
        case "-": result = left - right; break;
        case "*": result = left * right; break;
        case "/": result = right === 0 ? NaN : left / right; break;
        default: return;
      }

      current = Number.isFinite(result)
        ? String(Number(result.toPrecision(10)))
        : "Error";
      stored = null;
      operator = null;
      replaceCurrent = true;
      updateDisplay();
    }

    function chooseOperator(nextOperator) {
      if (current === "Error") return;
      if (operator && !replaceCurrent) calculate();
      stored = current;
      operator = nextOperator;
      replaceCurrent = true;
    }

    function clear() {
      current = "0";
      stored = null;
      operator = null;
      replaceCurrent = false;
      updateDisplay();
    }

    function handleAction(action) {
      if (action === "clear") clear();
      if (action === "delete") {
        if (current === "Error" || replaceCurrent) {
          current = "0";
          replaceCurrent = false;
        } else {
          current = current.length > 1 ? current.slice(0, -1) : "0";
          if (current === "-") current = "0";
        }
        updateDisplay();
      }
      if (action === "sign" && current !== "Error" && current !== "0") {
        current = current.startsWith("-") ? current.slice(1) : `-${current}`;
        updateDisplay();
      }
      if (action === "decimal") enterDecimal();
      if (action === "equals") calculate();
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      if (button.dataset.operator) chooseOperator(button.dataset.operator);
      if (button.dataset.action) handleAction(button.dataset.action);
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) enterDigit(event.key);
      else if (event.key === ".") enterDecimal();
      else if (["+", "-", "*", "/"].includes(event.key)) chooseOperator(event.key);
      else if (event.key === "Enter" || event.key === "=") handleAction("equals");
      else if (event.key === "Backspace") handleAction("delete");
      else if (event.key === "Escape") clear();
      else return;
      event.preventDefault();
    });
  </script>
</body>
</html>
